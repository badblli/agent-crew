name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Claude Code release cannot change the plugin checks under a PR.
  CLAUDE_CODE_VERSION: 2.1.289

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: pytest (team scripts with stub engines, Jev routing)
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - run: claude plugin validate .
      - run: claude plugin test .
      - name: install from this checkout as the README does
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install agent-crew@agent-crew
          claude plugin details agent-crew@agent-crew

  codex-install:
    name: Codex plugin install
    runs-on: ubuntu-latest
    env:
      CODEX_CLI_VERSION: 0.162.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g "@openai/codex@$CODEX_CLI_VERSION"
      - name: Install and verify the Codex plugin from this checkout
        run: |
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          result="$(codex plugin add agent-crew@agent-crew --json)"
          version="$(jq -er '.version' .codex-plugin/plugin.json)"
          jq -e --arg version "$version" '.pluginId == "agent-crew@agent-crew" and .version == $version' <<< "$result"
          installed="$(jq -er '.installedPath' <<< "$result")"
          test -f "$installed/skills/crew-init/SKILL.md"
          test -f "$installed/skills/crew-lead/SKILL.md"
          test -f "$installed/.codex-plugin/hooks.json"
          test -f "$installed/.codex-plugin/session_start.py"
          test -f "$installed/tools/sync_bin.py"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck templates/bin/*.sh
