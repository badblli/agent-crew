name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Claude Code release cannot change the plugin checks under a PR.
  CLAUDE_CODE_VERSION: 2.1.289

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: pytest (team scripts with stub engines, Jev routing)
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - run: claude plugin validate .
      - run: claude plugin test .
      - name: install from this checkout as the README does
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install agent-crew@agent-crew
          claude plugin details agent-crew@agent-crew

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck templates/bin/*.sh
